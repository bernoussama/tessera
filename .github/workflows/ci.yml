name: CI

# Regression gate for every pull request and every push to main. Three jobs run in parallel,
# each on its own 4-core runner: lint (fmt, clippy -D warnings, assets, layers), test (nextest,
# own-main tests; the workspace has no doctests) and wasm (the web build check). Cargo and nextest use every core by
# default; each job logs the count it got.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; pushes to main always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: smaller target dirs and caches, faster links.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # ALSA, X11/Wayland and fonts for the native build; software Vulkan for the UI tests.
  APT_PACKAGES: >-
    pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
    libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
    libgl1-mesa-dev libasound2-dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "cores=$(nproc)"
      # Cached .debs: `apt-get update` alone has taken minutes on a slow mirror.
      # The Ubuntu mirror is sometimes very slow (minutes for one package), so the downloaded
      # .debs are cached; apt still installs them normally.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: System libraries
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" $APT_PACKAGES
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Also keep our own crates' build output: a PR that leaves a crate alone reuses it.
          cache-workspace-crates: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo xtask assets
      - run: cargo xtask layers

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "cores=$(nproc)"
      # The Ubuntu mirror is sometimes very slow (minutes for one package), so the downloaded
      # .debs are cached; apt still installs them normally.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: System libraries
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" $APT_PACKAGES
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Also keep our own crates' build output: a PR that leaves a crate alone reuses it.
          cache-workspace-crates: true
      - uses: taiki-e/install-action@nextest
      - run: cargo xtask test

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "cores=$(nproc)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Also keep our own crates' build output: a PR that leaves a crate alone reuses it.
          cache-workspace-crates: true
      - run: cargo xtask wasm
